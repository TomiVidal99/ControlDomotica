<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta id="viewport" name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=2, viewport-fit=cover">
    <title>Domótica | Configuracion de red</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            --lapis-lazuli: #336699ff;
            --carolina-blue: #86bbd8ff;
            --charcoal: #2f4858ff;
            --light-green: #9ee493ff;
            --nyanza: #daf7dcff;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ddd;
        }

        body {
            margin: 20px;
            background-color: var(--charcoal);
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            margin-top: 10px;
        }

        .container {
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 40vw;
            flex-direction: column;
        }

        .form-group {
            max-width: 600px;
            margin-bottom: 15px;
            width: 100%;
        }

        .form-container {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .device-btn {
            font-size: 1.2em;
            font-weight: bold;
            outline: none;
            border: 1px solid black;
            background-color: var(--nyanza);
            color: var(--charcoal);
            padding: .7em .8em;
            border-radius: 5px;
            cursor: pointer;
        }

        .device-btn:hover {
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }

        .spinner-container {
            padding-top: 40px;
        }

        .spinner {
            stroke: var(--light-green);
            transform: scale(3);
        }

        .success-msg {
            display: flex;
            flex-direction: row;
            gap: 30px;
            color: var(--light-green);
            font-size: 20pt;
            font-weight: bold;
        }

        .success-msg svg {
            transform: scale(2);
        }
    </style>
    <script defer>
        const WS_CODES = {
            NEW_CLIENT: 'new::client',
            REMOVED_CLIENT: 'removed::client',
            GET_DEVICES: 'get::devices',
            REQUEST_INFO: 'req::info',
            SEND_CMD: 'use::cmd',
            UPDATE_CREDENTIALS_CMD: "set::lan",
            CREDENTIALS_UPDATED_ACK: "cred::success",
        }
        var websocket;
        function initWebSocket() {
            websocket = new WebSocket("ws://esp32-device.local:81/");
            console.log("Connecting to web sockets: " + websocket);

            websocket.onmessage = function (event) {
                console.log(event);
                console.info(event.data);
                //document.getElementById("status").innerHTML = event.data;
                const splitted = event.data.split("\n")[0].split(",");
                switch (splitted[0]) {
                    case WS_CODES.CREDENTIALS_UPDATED_ACK:
                        {
                            document.getElementById("success-msg-id").classList.toggle("hidden");
                            document.getElementById("spinner").classList.toggle("hidden");
                        }
                        return;
                }
            };
        }
        function sendCredentials() {
            ssid = document.getElementById("ssid").value;
            passwd = document.getElementById("password").value;

            websocket.send(`${WS_CODES.UPDATE_CREDENTIALS_CMD};;${ssid};;${passwd}`);

            document.getElementById("ssid").value = "";
            document.getElementById("password").value = "";

            document.getElementById("spinner").classList.toggle("hidden");
            document.getElementById("update-creds-btn").classList.toggle("hidden");
        }

    </script>
</head>

<body onload="initWebSocket()">
    <div class="container">
        <h1>Configuración de la red</h1>
        <div class="form-group">
            <label for="ssid">WiFi SSID:</label>
            <input type="text" id="ssid" name="ssid" placeholder="mi-wifi-1234" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="*****" required>
        </div>

        <button id="update-creds-btn" class="device-btn" onClick="sendCredentials()">Guardar y
            Actualizar</button>

        <div id="success-msg-id" class="hidden success-msg">
            <span class="">Credenciales actualizadas</span>
            <div class="">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="m10.6 16.6l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22" />
                </svg>
            </div>
        </div>

        <div id="spinner" class="hidden spinner-container">
            <svg class="spinner " width="24" height="24" stroke="#000" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <style>
                    .spinner_V8m1 {
                        transform-origin: center;
                        animation: spinner_zKoa 2s linear infinite
                    }

                    .spinner_V8m1 circle {
                        stroke-linecap: round;
                        animation: spinner_YpZS 1.5s ease-in-out infinite
                    }

                    @keyframes spinner_zKoa {
                        100% {
                            transform: rotate(360deg)
                        }
                    }

                    @keyframes spinner_YpZS {
                        0% {
                            stroke-dasharray: 0 150;
                            stroke-dashoffset: 0
                        }

                        47.5% {
                            stroke-dasharray: 42 150;
                            stroke-dashoffset: -16
                        }

                        95%,
                        100% {
                            stroke-dasharray: 42 150;
                            stroke-dashoffset: -59
                        }
                    }
                </style>
                <g class="spinner_V8m1">
                    <circle cx="12" cy="12" r="9.5" fill="none" stroke-width="3" />
                </g>
            </svg>
        </div>

    </div>
</body>

</html>
